<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart NFC Review Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7fad8c;
      --primary-dark: #659172;
      --danger: #e05252;
      --bg: #f7f9f8;
      --text: #1f2924;
      --muted: #6b7a71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 420px; padding: 32px 26px; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.06); text-align: center; }
    .badge { display: inline-block; background: #eef5f0; color: var(--primary-dark); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    .form-group { text-align: left; margin-bottom: 16px; position: relative; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #e1e7e3; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--primary); }
    
    /* Dropdown saran tempat OpenStreetMap */
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1.5px solid #e1e7e3; border-top: none; border-radius: 0 0 12px 12px; max-height: 210px; overflow-y: auto; z-index: 99; box-shadow: 0 10px 24px rgba(0,0,0,0.08); display: none; }
    .suggestion-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f2f4f3; text-align: left; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: #f2f7f4; }
    .suggestion-title { font-weight: 600; color: var(--text); display: block; }
    .suggestion-sub { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

    .selected-place { background: #f2f7f4; border: 1px dashed var(--primary); padding: 10px 12px; border-radius: 10px; font-size: 12px; color: var(--primary-dark); margin-bottom: 16px; text-align: left; display: none; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: #fff0f0; color: var(--danger); border: 1px solid #ffd6d6; margin-top: 12px; }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .loader { width: 38px; height: 38px; border: 3.5px solid #e6eee8; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .manage-link { display: inline-block; margin-top: 22px; font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
    .toggle-manual { font-size: 11px; color: var(--primary-dark); cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 6px; }
    .msg { font-size: 13px; margin-top: 14px; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge" id="nfcBadge">ID: Memuat...</div>

  <!-- STATE 1: LOADING / REDIRECT -->
  <div id="loadingView">
    <div class="loader"></div>
    <h1 id="loadingTitle">Menghubungkan...</h1>
    <p class="sub" id="loadingSub">Mohon tunggu sebentar, sedang mengarahkan ke halaman ulasan.</p>
    <span class="manage-link hidden" id="manageBtn" onclick="openManageMode()">Kelola / Reset NFC</span>
  </div>

  <!-- STATE 2: AKTIVASI / MANAGE -->
  <div id="formView" class="hidden">
    <h1 id="formTitle">Aktivasi Standee NFC</h1>
    <p class="sub" id="formSub">Ketik nama bisnis Anda dan pilih dari saran lokasi yang muncul.</p>

    <div class="form-group">
      <label>Cari Nama Tempat / Bisnis</label>
      <input type="text" id="placeSearch" placeholder="Ketik nama toko / klinik / kafe..." autocomplete="off">
      <div class="suggestions" id="suggestionsBox"></div>
      <span class="toggle-manual" onclick="toggleManualInput()">Lokasi tidak ditemukan? Input manual / tempel link Maps</span>
    </div>

    <!-- Opsi cadangan jika bisnis baru belum terindeks di OpenStreetMap -->
    <div id="manualBox" class="hidden">
      <div class="form-group">
        <label>Nama Bisnis Anda</label>
        <input type="text" id="manualName" placeholder="Contoh: EMRA Clinic Jakarta">
      </div>
      <div class="form-group">
        <label>Link Google Maps / Review (Opsional)</label>
        <input type="url" id="manualUrl" placeholder="https://g.page/r/...">
      </div>
    </div>

    <div class="selected-place" id="selectedPlaceBox">
      <strong>Terpilih:</strong> <span id="selectedPlaceName">-</span><br>
      <small id="selectedPlaceAddr">-</small>
    </div>

    <div class="form-group">
      <label id="passwordLabel">Buat Password Baru</label>
      <input type="password" id="passwordInput" placeholder="Buat password (ingat untuk reset nanti)">
    </div>

    <button class="btn btn-primary" id="activateBtn" onclick="submitAction('activate')">Simpan & Aktifkan NFC</button>
    <button class="btn btn-danger hidden" id="resetBtn" onclick="submitAction('reset')">Hapus Data / Reset NFC</button>

    <div class="msg" id="statusMsg"></div>
  </div>
</div>

<script>
  // === KONFIGURASI ===
  const GAS_WEB_APP_URL = 'TEMPEL_WEB_APP_URL_APPS_SCRIPT_KAMU_DI_SINI';
  
  const urlParams = new URLSearchParams(window.location.search);
  const rawId = urlParams.get('id');
  const nfcId = rawId ? (/^\d+$/.test(rawId.trim()) ? rawId.trim().padStart(3, '0') : rawId.trim()) : null;
  const isManageMode = urlParams.get('mode') === 'manage';

  let selectedBusinessName = '';
  let selectedLocationInfo = '';
  let isManualMode = false;
  let redirectTimer = null;
  let searchTimeout = null;

  document.addEventListener('DOMContentLoaded', () => {
    if (!nfcId) {
      document.getElementById('nfcBadge').innerText = 'ID Kosong';
      document.getElementById('loadingTitle').innerText = 'Tag NFC Tidak Valid';
      document.getElementById('loadingSub').innerText = 'Gunakan parameter ?id=001 pada URL Anda.';
      document.querySelector('.loader').classList.add('hidden');
      return;
    }

    document.getElementById('nfcBadge').innerText = `ID: ${nfcId}`;
    checkNfcStatus();
    setupOsmAutocomplete();
  });

  async function checkNfcStatus() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?id=${encodeURIComponent(nfcId)}`);
      const data = await res.json();

      if (data.isActive && !isManageMode) {
        document.getElementById('loadingTitle').innerText = data.businessName;
        document.getElementById('loadingSub').innerText = 'Mengarahkan ke halaman ulasan dalam 2 detik...';
        document.getElementById('manageBtn').classList.remove('hidden');

        redirectTimer = setTimeout(() => {
          window.location.replace(data.reviewUrl);
        }, 1800);
      } else {
        showForm(data);
      }
    } catch (err) {
      document.getElementById('loadingTitle').innerText = 'Gagal Memuat Data';
      document.getElementById('loadingSub').innerText = 'Periksa koneksi internet atau konfigurasi Script.';
    }
  }

  function openManageMode() {
    if (redirectTimer) clearTimeout(redirectTimer);
    showForm({ isActive: true, businessName: document.getElementById('loadingTitle').innerText });
  }

  function showForm(data) {
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('formView').classList.remove('hidden');

    if (data && data.isActive) {
      document.getElementById('formTitle').innerText = 'Kelola / Reset NFC';
      document.getElementById('formSub').innerText = `Terhubung ke: ${data.businessName}. Masukkan password yang Anda buat saat aktivasi.`;
      document.getElementById('passwordLabel').innerText = 'Masukkan Password Anda';
      document.getElementById('passwordInput').placeholder = 'Ketik password yang Anda buat sebelumnya';
      document.getElementById('activateBtn').innerText = 'Simpan Perubahan Lokasi';
      document.getElementById('resetBtn').classList.remove('hidden');
    } else {
      document.getElementById('formTitle').innerText = 'Aktivasi Standee NFC';
      document.getElementById('formSub').innerText = 'Cari nama bisnis Anda di bawah ini, lalu buat password sendiri.';
      document.getElementById('passwordLabel').innerText = 'Buat Password Baru';
      document.getElementById('passwordInput').placeholder = 'Buat password (ingat untuk reset nanti)';
      document.getElementById('activateBtn').innerText = 'Simpan & Aktifkan NFC';
      document.getElementById('resetBtn').classList.add('hidden');
    }
  }

  function toggleManualInput() {
    isManualMode = !isManualMode;
    document.getElementById('manualBox').classList.toggle('hidden', !isManualMode);
    document.getElementById('suggestionsBox').style.display = 'none';
  }

  // Pencarian Autocomplete Gratis via Photon (OpenStreetMap)
  function setupOsmAutocomplete() {
    const input = document.getElementById('placeSearch');
    const box = document.getElementById('suggestionsBox');

    input.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const query = input.value.trim();

      if (query.length < 3) {
        box.style.display = 'none';
        return;
      }

      searchTimeout = setTimeout(async () => {
        try {
          // Fokus pencarian di area Indonesia (lat -2.5, lon 118)
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=-2.5&lon=118.0&limit=6`);
          const data = await res.json();

          box.innerHTML = '';
          if (!data.features || data.features.length === 0) {
            box.innerHTML = '<div class="suggestion-item"><span class="suggestion-sub">Tidak ditemukan. Klik tulisan "Input manual" di bawah.</span></div>';
            box.style.display = 'block';
            return;
          }

          data.features.forEach(item => {
            const p = item.properties;
            const name = p.name || query;
            const addrParts = [p.street, p.district, p.city, p.state, p.country].filter(Boolean);
            const address = addrParts.join(', ');

            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `<span class="suggestion-title">${name}</span><span class="suggestion-sub">${address || 'Indonesia'}</span>`;
            div.onclick = () => {
              selectedBusinessName = name;
              selectedLocationInfo = address;
              input.value = name;
              box.style.display = 'none';

              document.getElementById('selectedPlaceBox').style.display = 'block';
              document.getElementById('selectedPlaceName').innerText = name;
              document.getElementById('selectedPlaceAddr').innerText = address;
            };
            box.appendChild(div);
          });

          box.style.display = 'block';
        } catch (e) {
          console.error(e);
        }
      }, 350); // Jeda 350ms agar tidak spam saat mengetik
    });

    // Tutup dropdown jika klik di luar kotak
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.form-group')) {
        box.style.display = 'none';
      }
    });
  }

  async function submitAction(action) {
    const password = document.getElementById('passwordInput').value.trim();
    const statusMsg = document.getElementById('statusMsg');

    if (!password) {
      statusMsg.style.color = '#e05252';
      statusMsg.innerText = 'Password wajib diisi!';
      return;
    }

    let finalName = selectedBusinessName;
    let finalLoc = selectedLocationInfo;
    let customUrl = '';

    if (isManualMode) {
      finalName = document.getElementById('manualName').value.trim();
      customUrl = document.getElementById('manualUrl').value.trim();
      finalLoc = 'Indonesia';
    }

    if (action === 'activate' && !finalName) {
      statusMsg.style.color = '#e05252';
      statusMsg.innerText = 'Pilih nama tempat dari saran yang muncul atau isi manual!';
      return;
    }

    if (action === 'reset' && !confirm('Yakin ingin menghapus data bisnis & password dari NFC ini?')) {
      return;
    }

    statusMsg.style.color = '#6b7a71';
    statusMsg.innerText = 'Memproses data...';

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: action,
          id: nfcId,
          businessName: finalName,
          locationInfo: finalLoc,
          customUrl: customUrl,
          password: password
        })
      });
      const result = await res.json();

      if (result.status === 'success') {
        statusMsg.style.color = '#2e7d32';
        statusMsg.innerText = result.message;
        setTimeout(() => {
          window.location.href = `${window.location.pathname}?id=${encodeURIComponent(nfcId)}`;
        }, 1200);
      } else {
        statusMsg.style.color = '#e05252';
        statusMsg.innerText = result.message;
      }
    } catch (e) {
      statusMsg.style.color = '#e05252';
      statusMsg.innerText = 'Terjadi kesalahan jaringan.';
    }
  }
</script>

</body>
</html>
